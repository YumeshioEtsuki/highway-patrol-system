<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>公路巡查系统</title>
    <!-- 性能优化：预连接和异步加载字体 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(255,255,255,0.02);
            --stroke: rgba(255,255,255,0.08);
            --primary: #5b8bff;
            --muted: #94a3b8;
            --radius: 14px;
            --shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        body {
            font-family: "Space Grotesk", "Microsoft YaHei", sans-serif;
            background: radial-gradient(120% 120% at 20% 20%, rgba(91,139,255,0.25), transparent 45%),
                        radial-gradient(100% 140% at 80% 10%, rgba(122,240,216,0.18), transparent 50%),
                        #050914;
            margin: 0;
            padding: 0 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            color: #f4f6fb;
        }
        .card {
            background: var(--panel);
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--stroke);
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-bottom: 0.4rem;
            font-size: 30px;
        }
        p { color: var(--muted); }
        .sub { margin-top: 0; margin-bottom: 1.2rem; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: linear-gradient(135deg, #5b8bff, #4a68ff);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 12px 30px rgba(75,115,255,0.25);
            transition: all 0.18s ease;
        }
        .btn:hover { transform: translateY(-1px) scale(1.01); box-shadow: 0 16px 38px rgba(75,115,255,0.35); }
        .footer {
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--stroke);
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            color: #e2e8f0;
            appearance: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 6px 18px rgba(0,0,0,0.25);
        }
        .features {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .feature-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--stroke);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            box-shadow: 0 10px 28px rgba(0,0,0,0.2);
        }
        .feature-title { margin: 0 0 4px 0; font-weight: 700; }
        .feature-desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛣️ 公路巡查系统</h1>
        <p class="sub">基于 FastAPI + MySQL，支持巡查上报、后台管控与统计导出。</p>
        <div class="features">
            <div class="feature-card">
                <p class="feature-title">巡查员工作台</p>
                <p class="feature-desc">上报问题、上传照片、查看个人巡查记录。</p>
            </div>
            <div class="feature-card">
                <p class="feature-title">管理员看板</p>
                <p class="feature-desc">多维筛选、导出 Excel、实时统计与问题分类概览。</p>
            </div>
            <div class="feature-card">
                <p class="feature-title">诊断与重置</p>
                <p class="feature-desc">数据库校验、状态检查、一键重置（含测试数据）。</p>
            </div>
        </div>
        <a href="patrol.html" class="btn">👤 巡查员登录</a>
        <a href="admin.html" class="btn" id="adminBtn">🛠️ 管理员入口</a>
        <a href="map.html" class="btn">🌍 世界地图分析</a>
    </div>
    <div class="footer">
        © 2025 公路养护中心 | 基于 FastAPI + MySQL
    </div>

    <script>
        // 可选：隐藏管理员按钮（如果希望完全靠后端鉴权，可不加）
        // 这里先保留，实际权限由后端控制
    </script>
</body>
</html>
