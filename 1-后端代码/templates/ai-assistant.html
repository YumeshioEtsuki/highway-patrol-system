<!-- AI Assistant Float Window -->
<!-- 放在 patrol.html 和 admin.html 的 </body> 前 -->

<style>
/* AI 助手浮窗样式 - 贴合深色玻璃拟态看板风格 */
:root {
    --ai-accent: #c084fc;
    --ai-accent-strong: #a855f7;
    --ai-surface: rgba(18, 26, 43, 0.85);
    --ai-border: rgba(255, 255, 255, 0.08);
    --ai-text: #e8edf5;
    --ai-muted: #9aa4b5;
    --ai-card-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    --ai-font: 'Manrope', 'Segoe UI', 'Microsoft YaHei', sans-serif;
}

.ai-assistant-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10000;
    font-family: var(--ai-font);
    color: var(--ai-text);
}

.ai-assistant-button {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    background: radial-gradient(circle at 20% 20%, #d8b4fe, var(--ai-accent));
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #0b1221;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(192, 132, 252, 0.30);
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
}

.ai-assistant-button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 16px 36px rgba(168, 85, 247, 0.35);
    filter: brightness(1.05);
}

.ai-assistant-button.active { display: none; }

.ai-chat-window {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 400px;
    height: 620px;
    background: var(--ai-surface);
    border: 1px solid var(--ai-border);
    border-radius: 18px;
    box-shadow: var(--ai-card-shadow);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(12px) scale(0.96);
    transition: all 0.28s ease;
    pointer-events: none;
    z-index: 10001;
    backdrop-filter: blur(12px);
}

.ai-chat-window.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
}

.ai-chat-header {
    padding: 16px 18px;
    background: linear-gradient(120deg, rgba(192, 132, 252, 0.16), rgba(168, 85, 247, 0.24));
    color: var(--ai-text);
    border-radius: 18px 18px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--ai-border);
}

.ai-chat-header h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.ai-chat-close {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--ai-border);
    color: var(--ai-text);
    font-size: 18px;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    transition: all 0.2s ease;
}

.ai-chat-close:hover { background: rgba(255, 255, 255, 0.14); }

.ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: radial-gradient(circle at 20% 20%, rgba(192, 132, 252, 0.06), transparent 35%),
                radial-gradient(circle at 80% 10%, rgba(168, 85, 247, 0.06), transparent 30%),
                rgba(12, 18, 32, 0.65);
    border-bottom: 1px solid var(--ai-border);
}

.ai-message { display: flex; gap: 8px; animation: slideIn 0.28s ease; }
.ai-message.user { justify-content: flex-end; }

@keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.ai-message-bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    word-wrap: break-word;
    border: 1px solid var(--ai-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.ai-message.assistant .ai-message-bubble {
    background: rgba(255, 255, 255, 0.04);
    color: var(--ai-text);
}

.ai-message.user .ai-message-bubble {
    background: linear-gradient(135deg, #d8b4fe, var(--ai-accent));
    color: #1a0b2e;
    border: 0;
    box-shadow: 0 10px 26px rgba(192, 132, 252, 0.40);
}

.ai-message.system .ai-message-bubble {
    background: rgba(255, 200, 87, 0.12);
    color: #facc15;
    font-size: 12px;
    text-align: center;
    margin: 4px 0;
    border-color: rgba(250, 204, 21, 0.35);
}

.ai-message.loading .ai-message-bubble {
    background: rgba(255, 255, 255, 0.04);
}

.ai-typing-indicator { display: flex; gap: 4px; padding: 6px 4px; }
.ai-typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ai-muted);
    animation: typing 1.2s infinite;
}
.ai-typing-dot:nth-child(2) { animation-delay: 0.2s; }
.ai-typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { opacity: 0.5; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-8px); }
}

.ai-input-area {
    padding: 12px;
    display: flex;
    gap: 10px;
    background: rgba(12, 18, 32, 0.72);
    border-radius: 0 0 18px 18px;
}

.ai-input {
    flex: 1;
    border: 1px solid var(--ai-border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--ai-text);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 13px;
    outline: none;
    resize: none;
    font-family: var(--ai-font);
    transition: border 0.2s ease, box-shadow 0.2s ease;
}

.ai-input::placeholder { color: var(--ai-muted); }

.ai-input:focus {
    border-color: rgba(192, 132, 252, 0.6);
    box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.12);
}

.ai-send-btn {
    background: linear-gradient(135deg, var(--ai-accent), var(--ai-accent-strong));
    color: #1a0b2e;
    border: 0;
    border-radius: 12px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    font-size: 16px;
    box-shadow: 0 10px 22px rgba(192, 132, 252, 0.30);
}

.ai-send-btn:hover:not(:disabled) {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 14px 26px rgba(168, 85, 247, 0.38);
    filter: brightness(1.05);
}

.ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

@media (max-width: 480px) {
    .ai-chat-window {
        width: calc(100vw - 32px);
        height: 68vh;
        max-height: 520px;
    }
}
</style>

<div class="ai-assistant-container">
    <!-- 浮球按钮 -->
    <button class="ai-assistant-button" onclick="toggleAIChat()" title="打开 Qwen 助手">
        💬
    </button>
    
    <!-- 聊天窗口 -->
    <div class="ai-chat-window" id="aiChatWindow">
        <div class="ai-chat-header">
            <h3>🤖 Qwen</h3>
            <button class="ai-chat-close" onclick="toggleAIChat()">✕</button>
        </div>
        
        <div class="ai-messages" id="aiMessages"></div>
        
        <div class="ai-input-area">
            <textarea 
                class="ai-input" 
                id="aiInput" 
                placeholder="输入你的问题..." 
                rows="1"
                onkeydown="handleInputKeydown(event)"></textarea>
            <button class="ai-send-btn" id="aiSendBtn" onclick="sendAIMessage()">
                📤
            </button>
        </div>
    </div>
</div>

<script>
// ========================
// AI 助手浮窗逻辑
// ========================

let aiChatHistory = [];  // 对话历史
let aiChatLoading = false;  // 是否在加载中

function toggleAIChat() {
    const window = document.getElementById('aiChatWindow');
    window.classList.toggle('active');
    if (window.classList.contains('active')) {
        // 窗口打开时，如果是第一次，显示欢迎消息
        if (aiChatHistory.length === 0) {
            addAISystemMessage('👋 你好！我是 Qwen，可以回答你的问题。');
        }
        // 聚焦输入框
        setTimeout(() => document.getElementById('aiInput').focus(), 100);
    }
}

function addAIMessage(text, role = 'assistant') {
    const messagesDiv = document.getElementById('aiMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `ai-message ${role}`;
    msgDiv.innerHTML = `<div class="ai-message-bubble">${escapeHtml(text)}</div>`;
    messagesDiv.appendChild(msgDiv);
    
    // 记录到历史
    aiChatHistory.push({ role, content: text });
    
    // 自动滚到底部
    setTimeout(() => {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }, 10);
}

function addAISystemMessage(text) {
    const messagesDiv = document.getElementById('aiMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'ai-message system';
    msgDiv.innerHTML = `<div class="ai-message-bubble">${escapeHtml(text)}</div>`;
    messagesDiv.appendChild(msgDiv);
    
    setTimeout(() => {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }, 10);
}

function showAILoading() {
    const messagesDiv = document.getElementById('aiMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'ai-message assistant loading';
    msgDiv.id = 'aiLoadingMsg';
    msgDiv.innerHTML = `
        <div class="ai-typing-indicator">
            <span class="ai-typing-dot"></span>
            <span class="ai-typing-dot"></span>
            <span class="ai-typing-dot"></span>
        </div>
    `;
    messagesDiv.appendChild(msgDiv);
    
    setTimeout(() => {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }, 10);
}

function removeAILoading() {
    const loading = document.getElementById('aiLoadingMsg');
    if (loading) {
        loading.remove();
    }
}

async function sendAIMessage() {
    const input = document.getElementById('aiInput');
    const query = input.value.trim();
    
    if (!query) {
        input.focus();
        return;
    }
    
    if (aiChatLoading) return;
    
    // 添加用户消息
    addAIMessage(query, 'user');
    input.value = '';
    input.style.height = 'auto';
    
    // 禁用发送按钮
    const sendBtn = document.getElementById('aiSendBtn');
    sendBtn.disabled = true;
    aiChatLoading = true;
    
    showAILoading();
    
    try {
        // 构建请求消息（排除 system 角色）
        const messages = aiChatHistory.filter(m => m.role !== 'system');
        
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                messages: messages,
                query: query
            })
        });
        
        removeAILoading();
        
        if (!res.ok) {
            const errData = await res.json();
            addAISystemMessage('❌ ' + (errData.detail || '服务出错，请重试'));
            return;
        }
        
        const data = await res.json();
        if (data.success) {
            addAIMessage(data.reply, 'assistant');
        } else {
            addAISystemMessage('❌ ' + (data.error || '获取回复失败'));
        }
    } catch (e) {
        removeAILoading();
        addAISystemMessage('❌ 网络错误: ' + e.message);
    } finally {
        sendBtn.disabled = false;
        aiChatLoading = false;
        input.focus();
    }
}

function handleInputKeydown(event) {
    // Enter 发送，Shift+Enter 换行
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendAIMessage();
    }
}

function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
}

// 自动调整输入框高度
document.addEventListener('DOMContentLoaded', () => {
    const aiInput = document.getElementById('aiInput');
    if (aiInput) {
        aiInput.addEventListener('input', () => {
            aiInput.style.height = 'auto';
            aiInput.style.height = Math.min(aiInput.scrollHeight, 80) + 'px';
        });
    }
});
</script>
