    // 过滤掉小岛/南海诸岛等干扰要素
    function filterGeojson(geoJson, options = {}) {
      const {
        dropTinyPolygons = true,
        ratioThreshold = 0.015, // 相对主轮廓面积的阈值
        minArea = 0.002        // 绝对面积兜底，过滤极小碎片
      } = options;

      const block = /islands?|is\.|岛|群岛|诸岛|南海诸岛|南沙群岛|西沙群岛|中沙群岛|黄岩岛|reunion|mayotte|guadeloupe|martinique|saint|圣诞岛|安的列斯|马提尼克|留尼汪|马约特/i;
      const dropByName = new Set(['南海诸岛', '南沙群岛', '西沙群岛', '中沙群岛', '黄岩岛']);

      const bboxArea = (polygonCoords) => {
        // polygonCoords: [ [ [lon, lat], ... ] ]
        const flat = polygonCoords.flat();
        const lats = flat.map(p => p[1]);
        const lons = flat.map(p => p[0]);
        const latMin = Math.min(...lats), latMax = Math.max(...lats);
        const lonMin = Math.min(...lons), lonMax = Math.max(...lons);
        return (latMax - latMin) * (lonMax - lonMin);
      };

      const cleanGeometry = (geometry) => {
        if (!dropTinyPolygons || !geometry || !geometry.type) return geometry;

        if (geometry.type === 'MultiPolygon') {
          const polys = geometry.coordinates || [];
          if (!polys.length) return geometry;
          const areas = polys.map(p => bboxArea(p));
          const maxArea = Math.max(...areas);
          const kept = polys.filter((poly, idx) => {
            const area = areas[idx];
            return area >= maxArea * ratioThreshold || area >= minArea;
          });
          const coords = kept.length ? kept : [polys[areas.indexOf(maxArea)]]; // 至少保留主体轮廓
          return { ...geometry, coordinates: coords };
        }

        if (geometry.type === 'Polygon') {
          const coords = geometry.coordinates || [];
          if (!coords.length) return geometry;
          const area = bboxArea(coords);
          if (area < minArea) return geometry; // 单一主体，直接保留
          return geometry;
        }

        return geometry;
      };

      const cleanedFeatures = (geoJson.features || [])
        .filter(f => {
          const name = (f.properties && (f.properties.name || f.properties.NL_NAME_1 || f.properties.fullname)) || '';
          if (dropByName.has(name.trim())) return false;
          return !block.test(name);
        })
        .map(f => ({ ...f, geometry: cleanGeometry(f.geometry) }));

      return { ...geoJson, features: cleanedFeatures };
    }

    // 计算指定要素的经纬度边界（用于精确城市筛选）
    function getFeatureBoundsByName(geoJson, targetName) {
      if (!geoJson || !geoJson.features) return null;
      const match = geoJson.features.find(f => {
        const name = (f.properties && (f.properties.name || f.properties.NL_NAME_1 || f.properties.fullname)) || '';
        return name === targetName;
      });
      if (!match || !match.geometry) return null;

      const collect = [];
      const pushCoords = (coords) => {
        coords.forEach(c => {
          if (Array.isArray(c[0])) {
            pushCoords(c);
          } else if (Array.isArray(c) && c.length >= 2) {
            collect.push({ lon: c[0], lat: c[1] });
          }
        });
      };

      if (match.geometry.type === 'Polygon') {
        pushCoords(match.geometry.coordinates || []);
      } else if (match.geometry.type === 'MultiPolygon') {
        match.geometry.coordinates.forEach(p => pushCoords(p));
      }

      if (!collect.length) return null;
      const lats = collect.map(p => p.lat);
      const lons = collect.map(p => p.lon);
      return {
        lat_min: Math.min(...lats),
        lat_max: Math.max(...lats),
        lon_min: Math.min(...lons),
        lon_max: Math.max(...lons)
      };
    }

    function bindChinaClick() {
      mapChart.off('click');
      mapChart.on('click', async (params) => {
        if (currentView !== 'china') return;
        const provinceName = params.name;
        currentProvinceName = provinceName;
        currentProvinceAdcode = PROVINCE_NAME_TO_ADCODE[provinceName];
        currentCityName = '';
        document.getElementById('regionTitle').textContent = provinceName + ' · 数据';
        if (PROVINCE_NAME_TO_ID[provinceName]) {
          document.getElementById('provinceSelector').value = PROVINCE_NAME_TO_ID[provinceName];
        }
        // 切换到该省地图并尝试获取省级统计
        await loadProvinceMap(provinceName, currentProvinceAdcode);
        const stats = await fetchStats({ scope: 'province', province: provinceName });
        renderCharts(stats);
      });
    }

    async function loadProvinceMap(provinceName, adcode) {
      if (!adcode) {
        console.warn('未找到省份编码，跳过省级地图加载:', provinceName);
        return;
      }
      const mapKey = `province-${adcode}`;
      if (!geoCache[mapKey]) {
        try {
          const url = `https://geo.datav.aliyun.com/areas_v3/bound/${adcode}_full.json`;
          console.log('📡 加载省级地图:', provinceName, url);
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const gjRaw = await res.json();
          const gj = filterGeojson(gjRaw);
          geoCache[mapKey] = gj;
          echarts.registerMap(mapKey, gj);
        } catch (e) {
          console.error('省级地图加载失败:', provinceName, e);
          return;
        }
      }

      // 配置省级地图（显示下属城市）
      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          formatter: '{b}',
          backgroundColor: 'rgba(15,23,42,0.9)',
          borderColor: '#7af0d8',
          textStyle: {color: '#cbd5e1'}
        },
        series: [{
          type: 'map',
          map: mapKey,
          roam: true,
          zoom: 1.15,
          label: {
            show: true,
            color: '#9ae6b4',
            fontSize: 10
          },
          itemStyle: {
            areaColor: '#0b3b30',
            borderColor: '#22c55e',
            borderWidth: 1
          },
          emphasis: {
            itemStyle: {
              areaColor: '#059669',
              borderColor: '#34d399',
              borderWidth: 1.5
            },
            label: {
              show: true,
              color: '#fff',
              fontSize: 12,
              fontWeight: 'bold'
            }
          },
          regions: [{ name: '南海诸岛', itemStyle: { opacity: 0 }, label: { show: false } }]
        }]
      };

      mapChart.setOption(option, true);

      // 绑定城市点击：如果已选中该城市则取消，否则显示城市数据
      mapChart.off('click');
      mapChart.on('click', async (p) => {
        if (currentView !== 'china') return;
        const cityName = p.name;
        
        // 如果点击的城市已被选中，则取消选中（返回省份视图）
        if (currentCityName === cityName) {
          currentCityName = '';
          document.getElementById('regionTitle').textContent = `${provinceName} · 数据`;
          const stats = await fetchStats({ scope: 'province', province: provinceName });
          renderCharts(stats);
        } else {
          // 否则显示新城市的数据
          currentCityName = cityName;
          document.getElementById('regionTitle').textContent = `${provinceName} · ${cityName} · 数据`;
          const bounds = getFeatureBoundsByName(geoCache[mapKey], cityName);
          const stats = await fetchStats({ scope: 'city', province: provinceName, city: cityName, bounds });
          renderCharts(stats);
        }
      });

      // 空白区域点击返回中国总览
      mapChart.getZr().off('click', zrBackgroundHandler);
      mapChart.getZr().on('click', zrBackgroundHandler);
    }

    async function zrBackgroundHandler(ev) {
      // 如果点到地图要素，则忽略（有 target 且不是整个画布）
      if (ev.target) return;
      if (currentProvinceAdcode) {
        // 在省级地图时点击空白，返回中国地图
        switchView('china');
      } else if (currentView === 'china') {
        // 在中国地图时点击空白，返回世界地图
        switchView('world');
      }
    }

    async function switchView(view) {
      currentView = view;
      const worldBtn = document.getElementById('viewWorld');
      const chinaBtn = document.getElementById('viewChina');
      const regionSelector = document.getElementById('regionSelector');
      const provinceSelector = document.getElementById('provinceSelector');
      const pageTitle = document.getElementById('pageTitle');
      const pageSubtitle = document.getElementById('pageSubtitle');
      
      if (view === 'world') {
        // 切换到世界视图
        worldBtn.style.background = 'rgba(91,139,255,0.9)';
        worldBtn.style.color = '#fff';
        chinaBtn.style.background = 'transparent';
        chinaBtn.style.color = '#94a3b8';
        regionSelector.style.display = 'block';
        provinceSelector.style.display = 'none';
        pageTitle.textContent = '🌍 世界地图分析';
        pageSubtitle.textContent = '点击大洲查看区域统计，或选择下拉菜单查看全球数据';
        currentProvinceAdcode = null;
        currentProvinceName = '';
        currentCityName = '';
        initMap();
        // 加载世界数据
        const stats = await fetchStats({ scope:'world', region:'' });
        renderCharts(stats);
      } else {
        // 切换到中国视图
        chinaBtn.style.background = 'rgba(16,185,129,0.9)';
        chinaBtn.style.color = '#fff';
        worldBtn.style.background = 'transparent';
        worldBtn.style.color = '#94a3b8';
        regionSelector.style.display = 'none';
        provinceSelector.style.display = 'block';
        pageTitle.textContent = '🇨🇳 中国地图分析';
        pageSubtitle.textContent = '点击省份查看区域统计，或选择下拉菜单查看各省数据';
        currentProvinceAdcode = null;
        currentProvinceName = '';
        currentCityName = '';
        document.getElementById('provinceSelector').value = '';
        document.getElementById('regionTitle').textContent = '全国总体 · 数据';
        initChinaMap();
        // 加载中国全国数据
        const stats = await fetchStats({ scope:'china', province:'' });
        renderCharts(stats);
      }
    }

    async function backToChinaBase() {
      if (currentView !== 'china') return;
      currentProvinceAdcode = null;
      currentProvinceName = '';
      currentCityName = '';
      document.getElementById('provinceSelector').value = '';
      document.getElementById('regionTitle').textContent = '全国总体 · 数据';
      await initChinaMap();
      const stats = await fetchStats({ scope:'china', province:'' });
      renderCharts(stats);
    }

    async function fetchStats(params){
      const { scope = 'world', region = '', province = '', city = '', bounds = null } = typeof params === 'string' ? { scope:'world', region: params } : (params || {});
      // 使用公开接口，带上作用域参数，后端可按需调整
      const searchParams = new URLSearchParams();
      searchParams.set('scope', scope);
      if (region) searchParams.set('region', region);
      if (province) searchParams.set('province', province);
      if (city) searchParams.set('city', city);
      if (bounds && bounds.lat_min !== undefined) {
        searchParams.set('lat_min', bounds.lat_min);
        searchParams.set('lat_max', bounds.lat_max);
        searchParams.set('lon_min', bounds.lon_min);
        searchParams.set('lon_max', bounds.lon_max);
      }

      const url = `/api/public/stats?${searchParams.toString()}`;
      try{
        console.log('📡 请求统计数据:', url);
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        console.log('📥 收到数据:', data);
        if(!data || data.severity_breakdown === undefined){ 
          console.warn('⚠️ 数据格式可能不完整:', data);
        }
        return data;
      }catch(e){
        console.error('❌ 统计数据获取失败:', e);
        // 返回示例数据
        return {
          total_records: 0,
          status_breakdown: {pending:0, processing:0, resolved:0},
          type_breakdown: [{label:'路面破损',count:5},{label:'护栏损坏',count:3},{label:'标志缺失',count:2}],
          severity_breakdown: [{label:1,count:1},{label:2,count:2},{label:3,count:3},{label:4,count:3},{label:5,count:1}],
          recent_7_days: 5,
          recent_30_days: 20
        }
      }
    }

    function renderCharts(stats){
      console.log('🎨 开始渲染图表...', stats);
      const pieEl = document.getElementById('pie');
      const barEl = document.getElementById('bar');
      const lineEl = document.getElementById('line');
      charts.pie = charts.pie || echarts.init(pieEl);
      charts.bar = charts.bar || echarts.init(barEl);
      charts.line = charts.line || echarts.init(lineEl);
      
      // 更新记录数显示
      const totalRecords = stats.total_records || 0;
      document.getElementById('recordCount').textContent = `共 ${totalRecords} 条记录`;

      // 问题类型分布：圆环图
      const pieOpt = {
        title:{text:'问题类型分布', left:'left', textStyle:{color:'#cbd5e1', fontSize:14}},
        tooltip:{trigger:'item', formatter:'{b}: {c} ({d}%)'},
        series:[{type:'pie', radius:['40%','70%'], data:(stats.type_breakdown||[]).map(i=>({name:i.label, value:i.count})),
          itemStyle:{borderColor:'transparent', borderWidth:0},
          label:{color:'#cbd5e1', fontSize:11}}]
      };
      charts.pie.setOption(pieOpt);

      // 严重度分布：折线图（曲线）
      const lineOpt2 = {
        title:{text:'严重度分布', left:'left', textStyle:{color:'#cbd5e1', fontSize:14}},
        tooltip:{trigger:'axis'},
        xAxis:{type:'category', data:(stats.severity_breakdown||[]).map(i=>'级别'+i.label), 
               axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#94a3b8'}},
        yAxis:{type:'value', axisLine:{lineStyle:{color:'#334155'}}, 
               splitLine:{lineStyle:{color:'#1f2937'}}, axisLabel:{color:'#94a3b8'}},
        series:[{type:'line', data:(stats.severity_breakdown||[]).map(i=>i.count), 
                smooth:true, lineStyle:{color:'#7af0d8', width:2.5}, 
                areaStyle:{color:'rgba(122,240,216,0.15)'}, symbolSize:8, symbol:'circle'}]
      };
      charts.bar.setOption(lineOpt2);

      const daily = (stats.daily || []).map(d=>({date:d.date, count:d.count}));
      const dates = daily.length ? daily.map(d=>d.date) : ['近7天','近30天'];
      const values = daily.length ? daily.map(d=>d.count) : [stats.recent_7_days||0, stats.recent_30_days||0];
      const trendLineOpt = {
        title:{text:'新增趋势', left:'left', textStyle:{color:'#cbd5e1', fontSize:14}},
        tooltip:{trigger:'axis'},
        xAxis:{type:'category', data:dates, axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#94a3b8'}},
        yAxis:{type:'value', axisLine:{lineStyle:{color:'#334155'}}, 
               splitLine:{lineStyle:{color:'#1f2937'}}, axisLabel:{color:'#94a3b8'}},
        series:[{type:'line', data:values, smooth:true, lineStyle:{color:'#ff9800', width:2.5}, 
                areaStyle:{color:'rgba(255,152,0,0.15)'}, symbolSize:6}]
      };
      charts.line.setOption(trendLineOpt);
    }

    function waitFor(condFn, interval=50, timeout=5000){
      return new Promise((resolve, reject)=>{
        const start = Date.now();
        const timer = setInterval(()=>{
          if(condFn()) {clearInterval(timer); resolve(true);} 
          else if(Date.now()-start>timeout){clearInterval(timer); reject(new Error('timeout'));}
        }, interval);
      });
    }

    (async function(){
      console.log('🚀 页面加载开始');
      
      // 检查用户身份，根据不同身份显示不同按鑒
      try {
        const res = await fetch('/api/me', {
          headers: {'Authorization': `Bearer ${localStorage.getItem('access_token')}`}
        });
        if (res.ok) {
          const user = await res.json();
          console.log('👤 用户身份:', user.role);
          if (user.role === 'admin') {
            // 管理员：显示两个按鑒
            document.getElementById('backBtn1').style.display = 'inline-block';
            document.getElementById('backBtn2').style.display = 'inline-block';
          } else {
            // 普通用户：只显示返回patrol按鑒
            document.getElementById('backBtn1').style.display = 'inline-block';
            document.getElementById('backBtn2').style.display = 'none';
          }
        } else {
          // 未登录：绑定返回patrol按鑒
          document.getElementById('backBtn1').style.display = 'inline-block';
        }
      } catch (e) {
        console.warn('⚠️ 用户信息获取失败:', e);
        document.getElementById('backBtn1').style.display = 'inline-block';
      }
      
      // 先显示一个简单的消息确认JS正在运行
      document.getElementById('worldMap').innerHTML = '<div style="padding:24px;color:#7af0d8">⏳ 正在加载地图...</div>';
      
      try {
        // 先加载统计数据和图表
        console.log('📊 加载统计数据...');
        const stats = await fetchStats({ scope:'world', region:'' });
        console.log('✅ 统计数据加载成功:', stats);
        renderCharts(stats);
        
        // 清除加载提示
        document.getElementById('worldMap').innerHTML = '';
        
        // 再初始化地图
        console.log('🗺️ 初始化地图...');
        await initMap();
        console.log('✅ 地图初始化成功');

        // 视图切换按钮事件监听
        document.getElementById('viewWorld').addEventListener('click', () => {
          switchView('world');
        });
        
        document.getElementById('viewChina').addEventListener('click', () => {
          switchView('china');
        });
        
        // 区域选择器事件监听
        document.getElementById('regionSelector').addEventListener('change', async (e) => {
          const region = e.target.value;
          const displayName = region || '全球总体';
          document.getElementById('regionTitle').textContent = displayName + ' · 分析';
          console.log('🔄 切换区域:', region);
          const stats = await fetchStats({ scope:'world', region });
          renderCharts(stats);
          if (currentView === 'world') {
            await initMap();
          }
        });
        
        // 省份选择器事件监听
        document.getElementById('provinceSelector').addEventListener('change', async (e) => {
          const provinceId = e.target.value;
          const displayName = provinceId ? PROVINCE_NAMES[provinceId] : '全国总体';
          document.getElementById('regionTitle').textContent = displayName + ' · 分析';
          console.log('🔄 切换省份:', provinceId, displayName);
          currentProvinceName = displayName;
          currentProvinceAdcode = PROVINCE_NAME_TO_ADCODE[displayName] || null;
          currentCityName = '';
          if (provinceId && currentProvinceAdcode) {
            await loadProvinceMap(displayName, currentProvinceAdcode);
            const stats = await fetchStats({ scope:'province', province: displayName });
            renderCharts(stats);
          } else {
            const stats = await fetchStats({ scope:'china', province:'' });
            renderCharts(stats);
            await initChinaMap();
          }
        });
        
      } catch (e) {
        console.error('❌ 初始化错误:', e);
        console.error('错误堆栈:', e.stack);
        document.getElementById('worldMap').innerHTML = '<div style="padding:24px;color:#fca5a5">❌ 初始化失败：'+ e.message +'<br><small style="color:#94a3b8">错误: ' + e.stack + '</small></div>';
        // 即使地图失败，也尝试显示图表
        try {
          const stats = await fetchStats({ scope:'world', region:'' });
          renderCharts(stats);
        } catch (chartError) {
          console.error('图表也失败了:', chartError);
        }
      }
      
      console.log('✅ 初始化脚本执行完毕');
    })();
  </script>
