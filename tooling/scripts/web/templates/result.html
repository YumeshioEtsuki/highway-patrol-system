<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; text-align: center; }
        .success { color: #00aa00; font-size: 48px; margin-bottom: 20px; }
        h2 { color: #333; margin: 0 0 10px 0; }
        .summary { background: #f9f9f9; padding: 20px; border-radius: 4px; margin: 20px 0; }
        .summary p { margin: 8px 0; color: #666; }
        .summary strong { color: #333; }
        .warning { color: #c00; margin-top: 10px; }
        a { color: #0066cc; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="success">✅</div>
            <h2>Configuration Applied</h2>
            <div class="summary">
                <p><strong>Key:</strong> {{key}}</p>
                <p><strong>Value:</strong> <code>{{value}}</code></p>
                <p><strong>Mode:</strong> {% if is_custom %}Custom Value{% else %}Recommended Value{% endif %}</p>
                <p><strong>Updated:</strong> {{updated}}/{{total}} environments</p>
                {% if failed %}
                <p class="warning">⚠️ Failed environments: {{", ".join(failed)}}</p>
                {% endif %}
            </div>
            <p><a href="/">← Back to Home</a> | <a href="/list">View All Configurations</a></p>
        </div>
    </div>
</body>
</html>
