<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        h1 { color: #333; margin-bottom: 10px; }
        h3 { color: #333; margin-top: 30px; margin-bottom: 10px; }
        p { color: #666; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; background: #f9f9f9; font-weight: 600; }
        td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        .env-key { font-weight: 500; }
        .env-value { font-family: monospace; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>All Environment Configurations</h1>
            <p><a href="javascript:void(0)" onclick="window.location.href='/?t='+Date.now()">← Back to Home</a></p>
            
            {% for env in envs %}
            <h3>{{env.upper()}}</h3>
            <table>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
                {% for k, v in data.get(env, {}).items()|sort %}
                <tr>
                    <td class="env-key">{{k}}</td>
                    <td class="env-value">{{v}}</td>
                </tr>
                {% endfor %}
            </table>
            {% endfor %}
            
            <p style="margin-top: 30px;"><a href="javascript:void(0)" onclick="window.location.href='/?t='+Date.now()">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
