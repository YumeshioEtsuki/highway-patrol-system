<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        h2 { color: #333; margin-bottom: 20px; }
        h3 { color: #333; margin-bottom: 10px; }
        .help-box { background: #e8f4f8; border-left: 4px solid #0066cc; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .help-box p { color: #333; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f9f9f9; font-weight: 600; color: #333; }
        tr:hover { background: #f5f5f5; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 24px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        code { color: #0066cc; background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        hr { margin: 30px 0; border: none; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Analysis: <code>{{key}}</code></h2>
            
            <div class="help-box">
                <p><strong>Info:</strong> {{help_text}}</p>
            </div>
            
            <h3>Current vs Recommended Values</h3>
            <table>
                <tr>
                    <th>Environment</th>
                    <th>Current Value</th>
                    <th>Recommended Value</th>
                    <th>Apply</th>
                </tr>
                {% for env in envs %}
                <tr>
                    <td style="font-weight: bold; color: #333;">{{env}}</td>
                    <td style="font-family: monospace; color: #666;">{{current.get(env, "(not set)")}}</td>
                    <td style="font-family: monospace; color: #0066cc; font-weight: bold;">{{recommend.get(env, "")}}</td>
                    <td><input type="checkbox" name="env" value="{{env}}" checked form="apply-form"></td>
                </tr>
                {% endfor %}
            </table>
            
            <form id="apply-form" method="post" action="/apply">
                <input type="hidden" name="key" value="{{key}}">
                <div class="button-group">
                    <button type="submit" class="btn-primary">Apply Recommended Values</button>
                    <a href="/"><button type="button" class="btn-secondary">← Back</button></a>
                </div>
            </form>
            
            <hr>
            
            <h3>Apply Custom Value</h3>
            <form method="post" action="/custom">
                <input type="hidden" name="key" value="{{key}}">
                <div style="margin-bottom: 20px;">
                    <label>Custom Value:</label>
                    <input type="text" name="value">
                </div>
                <div style="margin-bottom: 20px;">
                    <label>Select Environments:</label>
                    {% for env in envs %}
                    <label style="display: inline-block; margin-right: 20px;">
                        <input type="checkbox" name="env" value="{{env}}" checked> {{env}}
                    </label>
                    {% endfor %}
                </div>
                <button type="submit" class="btn-primary">Apply Custom Value</button>
            </form>
        </div>
    </div>
</body>
</html>
