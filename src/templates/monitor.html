<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 数据库性能监控仪表板</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <!-- 使用非模块化 UMD 版本，确保全局 Chart 变量可用 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- 注意：Chart.js v4 以 ESM 为主，容易触发 "Cannot use import" 错误；这里采用 v3 UMD 版本兼容旧浏览器 -->
    <!-- 统一字体与预连接，与后台风格一致 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <style>
        :root {
            --bg: #0f172a;
            --card: #0b1223;
            --muted: #94a3b8;
            --primary: #5b8bff;
            --primary-2: #7af0d8;
            --stroke: rgba(255,255,255,0.08);
            --shadow: 0 20px 60px rgba(0,0,0,0.35);
            --radius: 14px;
            --glass: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Space Grotesk", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(120% 120% at 20% 20%, rgba(91,139,255,0.25), transparent 45%),
                        radial-gradient(100% 140% at 80% 10%, rgba(122,240,216,0.18), transparent 50%),
                        #050914;
            background-attachment: fixed;
            color: #f4f6fb;
            padding: 32px 18px 80px;
        }

        .container {
            max-width: 1220px;
            margin: 0 auto;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        header {
            background: linear-gradient(120deg, rgba(91,139,255,0.18), rgba(122,240,216,0.14));
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--stroke);
        }

        h1 {
            color: #e2e8f0;
            font-size: 26px;
            font-weight: 600;
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-healthy { background: #10b981; }
        .status-warning { background: #f59e0b; }
        .status-error { background: #ef4444; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: var(--glass);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--stroke);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .metric-card h3 {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .metric-unit {
            color: var(--muted);
            font-size: 14px;
        }

        .metric-change {
            font-size: 12px;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #666;
        }

        .metric-change.up {
            color: #10b981;
            background: #ecfdf5;
        }

        .metric-change.down {
            color: #ef4444;
            background: #fef2f2;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            background: var(--glass);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--stroke);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .chart-container h3 {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .slow-queries-section,
        .recommendations-section,
        .index-health-section {
            background: var(--glass);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--stroke);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            margin-bottom: 20px;
        }

        .slow-queries-section h2,
        .recommendations-section h2,
        .index-health-section h2 {
            color: #e2e8f0;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(91,139,255,0.35);
            padding-bottom: 10px;
        }

        .query-item {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-left: 4px solid #5b8bff;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--stroke);
        }

        .query-item .query-text {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: #e2e8f0;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--stroke);
        }

        .query-item .query-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--muted);
        }

        .recommendation-item {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-left: 4px solid #10b981;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--stroke);
        }

        .recommendation-item.high {
            border-left-color: #ef4444;
        }

        .recommendation-item.medium {
            border-left-color: #f59e0b;
        }

        .recommendation-item.low {
            border-left-color: #3b82f6;
        }

        .recommendation-priority {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .recommendation-priority.high {
            background: #fee2e2;
            color: #991b1b;
        }

        .recommendation-priority.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .recommendation-priority.low {
            background: #dbeafe;
            color: #1e3a8a;
        }

        .index-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .index-table th {
            background: rgba(255,255,255,0.04);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #e2e8f0;
            border-bottom: 2px solid var(--stroke);
        }

        .index-table td {
            padding: 12px;
            border-bottom: 1px solid var(--stroke);
            color: #cbd5e1;
        }

        .index-table tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .health-score {
            font-size: 24px;
            font-weight: 700;
            color: #5b8bff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.08);
            border-top: 4px solid #5b8bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .button {
            background: linear-gradient(135deg, rgba(91,139,255,0.4), rgba(91,139,255,0.25));
            color: #e2e8f0;
            border: 1px solid rgba(91,139,255,0.45);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 16px rgba(91,139,255,0.25);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(91,139,255,0.55), rgba(91,139,255,0.35));
            border-color: rgba(91,139,255,0.65);
            box-shadow: 0 12px 28px rgba(91,139,255,0.35);
        }

        .button.secondary {
            background: linear-gradient(135deg, rgba(122,240,216,0.3), rgba(122,240,216,0.18));
            color: #9ff6e2;
            border: 1px solid rgba(122,240,216,0.45);
            box-shadow: 0 6px 16px rgba(122,240,216,0.2);
        }

        .button.secondary:hover {
            background: linear-gradient(135deg, rgba(122,240,216,0.5), rgba(122,240,216,0.3));
            border-color: rgba(122,240,216,0.6);
            box-shadow: 0 12px 28px rgba(122,240,216,0.3);
        }

        .button.danger {
            background: linear-gradient(135deg, rgba(239,68,68,0.45), rgba(239,68,68,0.28));
            border: 1px solid rgba(239,68,68,0.55);
            color: #fee2e2;
        }

        .button.danger:hover {
            background: linear-gradient(135deg, rgba(239,68,68,0.65), rgba(239,68,68,0.45));
            border-color: rgba(239,68,68,0.75);
            box-shadow: 0 12px 28px rgba(239,68,68,0.35);
        }

        @media (max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>
                    <span class="status-indicator" id="statusIndicator"></span>
                    📊 数据库性能监控仪表板
                </h1>
                <p id="statusText" style="color: #666; margin-top: 5px; font-size: 14px;"></p>
            </div>
            <div>
                <button class="button" onclick="refreshData()">刷新数据</button>
                <button class="button secondary" onclick="generateRecommendations()" style="margin-left: 10px;">生成建议</button>
                <a href="/admin.html" class="button secondary" style="margin-left: 10px; text-decoration:none;">← 返回管理后台</a>
            </div>
        </header>

        <!-- 实时指标卡片 -->
        <div class="metrics-grid" id="metricsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>加载指标中...</p>
            </div>
        </div>

        <!-- 性能趋势图表 -->
        <div class="charts-grid">
            <div class="chart-container">
                <h3>查询速率趋势</h3>
                <div class="chart-wrapper">
                    <canvas id="queriesChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h3>平均查询时间趋势</h3>
                <div class="chart-wrapper">
                    <canvas id="latencyChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h3>缓存命中率趋势</h3>
                <div class="chart-wrapper">
                    <canvas id="cacheChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h3>活跃连接数趋势</h3>
                <div class="chart-wrapper">
                    <canvas id="connectionsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 慢查询分析 -->
        <div class="slow-queries-section">
            <h2>最近的慢查询 (Top 5)</h2>
            <div id="slowQueriesList">
                <div class="no-data">暂无数据</div>
            </div>
        </div>

        <!-- 索引健康 -->
        <div class="index-health-section">
            <h2>索引健康状态</h2>
            <div id="indexHealthContent">
                <div class="no-data">加载中...</div>
            </div>
        </div>

        <!-- 优化建议 -->
        <div class="recommendations-section">
            <h2>优化建议</h2>
            <div id="recommendationsList">
                <div class="no-data">暂无建议</div>
            </div>
        </div>
    </div>

    <script src="/static/js/monitor-dashboard.js"></script>
</body>
</html>
